
name: Test OpenAlex connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OpenAlex research search
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import date, timedelta

          key = os.environ.get("OPENALEX_API_KEY", "")
          if not key:
              raise SystemExit("Missing OpenAlex API key")

          today = date.today()
          start = today - timedelta(days=14)

          params = {
              "search.title_and_abstract": "Phocoena phocoena",
              "filter": (
                  f"from_created_date:{start.isoformat()},"
                  f"to_created_date:{today.isoformat()}"
              ),
              "per_page": "100",
              "cursor": "*",
              "api_key": key,
          }

          url = (
              "https://api.openalex.org/works?"
              + urllib.parse.urlencode(params)
          )

          try:
              with urllib.request.urlopen(url, timeout=40) as response:
                  print("SUCCESS: Research search accepted")
                  print("HTTP status:", response.status)
          except urllib.error.HTTPError as error:
              print("FAILED: HTTP", error.code)
              print(
                  "Retry-After:",
                  error.headers.get("Retry-After", "not supplied")
              )
              print(
                  "Response:",
                  error.read(1000).decode(
                      "utf-8", errors="replace"
                  )
              )
              raise SystemExit(1)
          PY
