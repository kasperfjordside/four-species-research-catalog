name: Daily research catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: four-species-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline safety tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Discover and validate
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/daily_update.py --pages 10
      - name: Commit catalog and checkpoint if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/catalog.json docs/catalog-page-*.json publisher_state.json discovery_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update four-species research catalog"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
